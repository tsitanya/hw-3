---
# tasks file for nginx

- name: dist-upgrade
  ansible.builtin.apt:
    upgrade: dist

- name: package update
  ansible.builtin.apt:
    name: "*"
    state: latest
    update_cache: yes

- name: nginx.conf copy
  copy:
    src: web-nginx.conf
    dest: /etc/nginx/nginx.conf
  notify:
    - restart nginx

- name: start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes