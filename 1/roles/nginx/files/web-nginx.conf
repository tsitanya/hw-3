events {}

http {
    upstream backend {
        server 10.24.13.128;
    }

    server {
        listen 80;
        server_name web;
    
        location /files/ {
            alias /var/www/html/;  
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
    
        location / {
            return 301 /files/;
        }
    }
}
